<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Milyluli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0b0410;
    --bg-mid: #2a0f2f;
    --accent: #ff6fa5;   /* rosa */
    --accent-2: #ffd27a; /* dorado */
    --accent-3: #ff9fc7; /* rosa claro */
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-deep);
    font-family: 'Playfair Display', 'Segoe UI', Verdana, sans-serif;
    color: #eee;
  }

  #galaxyCanvas {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: block;
    touch-action: none;
    cursor: grab;
  }

  #galaxyCanvas.dragging { cursor: grabbing; }

  /* ---------- PANTALLA DE BIENVENIDA ---------- */
  #welcome {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 20;
    transition: opacity 1.2s ease, visibility 1.2s ease;
    background: radial-gradient(ellipse at 50% 30%, var(--bg-mid), var(--bg-deep) 70%);
    overflow: hidden;
  }

  #welcome.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  #sparkleField {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .sparkle {
    position: absolute;
    font-size: 1rem;
    opacity: 0;
    animation: floatSparkle 4.5s ease-in-out infinite;
    filter: drop-shadow(0 0 6px rgba(255, 200, 220, 0.8));
  }

  @keyframes floatSparkle {
    0%   { opacity: 0; transform: translateY(10px) scale(0.6) rotate(0deg); }
    15%  { opacity: 1; }
    50%  { opacity: 0.85; transform: translateY(-18px) scale(1) rotate(15deg); }
    85%  { opacity: 0.2; }
    100% { opacity: 0; transform: translateY(-32px) scale(0.7) rotate(-10deg); }
  }

  #welcomeTitle {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(2.6rem, 10vw, 5.5rem);
    font-weight: 700;
    letter-spacing: 1px;
    margin: 0 0 0.3rem 0;
    line-height: 1.1;
    color: var(--accent-2);
    text-shadow:
      0 0 18px rgba(255, 111, 165, 0.55),
      0 0 38px rgba(255, 210, 122, 0.35);
  }

  #welcomeTitle .letter {
    display: inline-block;
    opacity: 0;
    transform: translateY(22px) scale(0.7);
    animation: letterIn 0.6s ease forwards;
  }

  @keyframes letterIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  #welcomeSubtitle {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    color: #e9c9d8;
    font-size: clamp(0.95rem, 2.4vw, 1.15rem);
    min-height: 1.6em;
    margin-bottom: 2.2rem;
    letter-spacing: 0.5px;
  }

  #welcomeSubtitle::after {
    content: '';
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--accent-2);
    margin-left: 3px;
    vertical-align: middle;
    animation: blinkCursor 0.9s steps(1) infinite;
  }

  #welcomeSubtitle.done::after { display: none; }

  @keyframes blinkCursor {
    50% { opacity: 0; }
  }

  #enterBtn {
    padding: 14px 42px;
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
    background: transparent;
    border: 1px solid var(--accent);
    border-radius: 40px;
    cursor: pointer;
    transition: all 0.35s ease;
    box-shadow: 0 0 15px rgba(255, 111, 165, 0.35);
    opacity: 0;
    transform: translateY(10px);
  }

  #enterBtn.show {
    animation: fadeUp 0.8s ease forwards;
  }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  #enterBtn:hover {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: #2a0f2f;
    box-shadow: 0 0 30px rgba(255, 111, 165, 0.7);
    transform: scale(1.05);
  }

  /* ---------- TARJETA DE FRASE ---------- */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 0, 15, 0.55);
    z-index: 25;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.35s ease, visibility 0.35s;
  }

  #overlay.show {
    opacity: 1;
    visibility: visible;
  }

  #phraseCard {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.85);
    max-width: 480px;
    width: 85%;
    padding: 36px 30px 30px;
    background: linear-gradient(160deg, rgba(42, 15, 47, 0.92), rgba(20, 6, 22, 0.92));
    border: 1px solid rgba(255, 159, 199, 0.45);
    border-radius: 18px;
    text-align: center;
    z-index: 30;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.35s ease, transform 0.35s ease, visibility 0.35s;
    backdrop-filter: blur(6px);
    box-shadow: 0 0 45px rgba(255, 111, 165, 0.28);
  }

  #phraseCard.show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
  }

  #cardIcon {
    font-size: 1.3rem;
    margin-bottom: 10px;
    color: var(--accent);
    text-shadow: 0 0 12px rgba(255, 111, 165, 0.7);
  }

  #phraseCard p {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    line-height: 1.65;
    font-style: italic;
    color: #fbeef4;
    margin: 0 0 22px 0;
  }

  #closeCard {
    background: transparent;
    border: 1px solid var(--accent-2);
    color: #f2ddc7;
    padding: 8px 24px;
    border-radius: 30px;
    cursor: pointer;
    letter-spacing: 1px;
    font-family: 'Playfair Display', serif;
    transition: all 0.3s;
  }

  #closeCard:hover {
    background: var(--accent-2);
    color: #2a0f2f;
  }

  #hint {
    position: fixed;
    bottom: 24px;
    width: 100%;
    text-align: center;
    color: rgba(255,255,255,0.35);
    font-size: 0.85rem;
    letter-spacing: 1px;
    z-index: 5;
    animation: fadeInOut 4s ease-in-out infinite;
    pointer-events: none;
    display: none;
  }

  @keyframes fadeInOut {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 0.6; }
  }

  #muteBtn {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 10;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(255, 159, 199, 0.4);
    background: rgba(30, 8, 30, 0.55);
    color: #eee;
    font-size: 1.1rem;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    transition: all 0.25s ease;
  }

  #muteBtn:hover {
    border-color: var(--accent);
    box-shadow: 0 0 14px rgba(255, 111, 165, 0.5);
  }

  /* ---------- CONTADOR DE TIEMPO JUNTOS ---------- */
  #loveCounter {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 10;
    padding: 10px 18px;
    border-radius: 20px;
    border: 1px solid rgba(255, 210, 122, 0.4);
    background: rgba(30, 8, 30, 0.55);
    backdrop-filter: blur(4px);
    font-family: 'Playfair Display', serif;
    font-size: 0.78rem;
    line-height: 1.5;
    color: #f6d9e6;
    letter-spacing: 0.4px;
    display: none;
    opacity: 0;
    transition: opacity 1s ease;
    text-align: left;
  }

  #loveCounter.show {
    display: block;
    opacity: 1;
  }

  #loveCounter b {
    color: var(--accent-2);
    font-weight: 600;
  }
</style>
</head>
<body>

<canvas id="galaxyCanvas"></canvas>
<audio id="bgMusic" preload="auto"></audio>

<div id="welcome">
  <div id="sparkleField"></div>
  <h1 id="welcomeTitle"></h1>
  <p id="welcomeSubtitle"></p>
  <button id="enterBtn">Entrar</button>
</div>

<p id="hint">Arrastra para rotar &middot; Rueda / pellizca para zoom &middot; Toca una estrella ✦</p>
<button id="muteBtn" title="Silenciar / activar sonido">🔊</button>
<div id="loveCounter"></div>

<div id="overlay"></div>
<div id="phraseCard">
  <div id="cardIcon">💗</div>
  <p id="phraseText"></p>
  <button id="closeCard">Cerrar</button>
</div>

<script>
/* ================= PERSONALIZACIÓN =================
   Cambia aquí el nombre y la fecha — es lo único que
   necesitas tocar para adaptarlo.                     */
const partnerName = "Milyluli";
const welcomeSubtitleText = "Una galaxia hecha solo para ti";

// Fecha en que empezaron (o cualquier fecha especial que quieras contar).
// Formato: 'AAAA-MM-DDTHH:MM:SS'
const START_DATE = new Date('2026-07-26T00:00:00'); // <-- CAMBIA ESTA FECHA

/* ================= FRASES =================
   No se modificó ninguna palabra — solo se agregaron
   las comas que faltaban entre elementos del array.    */
const phrases = [
  "Eres la unica novia que quiero.",
  "Te amo mucho muchote muchísimo.",
  "Cada ves que pienses o dudes si te amo, yo te puedo resolver esa duda.",
  "Siempre estoy para escucharte.",
  "Hacer cartas se volvio uno de mis pasa tiempos.",
  "Tú me cambiaste, me demostraste lo bonito que es abrazar.",
  "No me gusta bailar, lo raro, es que aprendería si me lo pides.",
  "Siempre quiero estar contigo, aun que mi cara diga lo contrario.",
  "Te dije más de una vez que te amo, que te amo muchísimo. No te olvides de eso. Yo jamás digo algo en lo que no creo.",
  "Me perdi en tu mirada, es que el color de tus ojos me encantan, no eran ni azules, ni verdes. Eran color café, café que quita el sueño, café que produce desvelos.",
  "Eres importante, eres inteligente, eres suficiente, eres increible, eres valiente, eres brillante, eres capaz, eres fuerte, y aun que no pienses eso, si, si lo eres.",
  "Te amaré 1200 meses. No, sabes que, mejor 1201 meses, o porque no, hasta donde nos de el tiempo y el inmenso espacio.",
  "No compitas con otras estrellas, brilla con tu propia luz.",
  "No sé porque dudo de que me amas, tal vez, porque ya no es igual que antes, tal vez espero un ¨te amo¨ de buenas noches, pero tal vez, eso ya no es como antes, y tendré que aceptarlo.",
  "Puede que parezca frío, pero en realidad, cuando digo que no tengo nada, tal vez espero un abrazo tullo, para alegrarme, tal vez, solo necesite tu iniciativa, pero tal vez eso este mal, tal vez, yo sea el que debe tomar la iniciativa.",
  "Siento y siento, y solo siento cosas que no son, por qué?, tal vez porque me dijo que me extraña, pero, no parece..",
  "Solo busco mejorar, cuando tal vez las cosas solo deben seguir, pero siento que si dejo que siga, tal vez, en un momento, te aburras.",
  "Comienzo a sentirme más cansado, diferente, pero feliz, como es mi última oportunidad, debería hacer las cosas bien, pero #-#&"
];

/* ================= BIENVENIDA ANIMADA ================= */
const welcomeTitleEl = document.getElementById('welcomeTitle');
const welcomeSubtitleEl = document.getElementById('welcomeSubtitle');
const enterBtnEl = document.getElementById('enterBtn');
const sparkleField = document.getElementById('sparkleField');

// nombre letra por letra
[...partnerName].forEach((ch, i) => {
  const span = document.createElement('span');
  span.textContent = ch === ' ' ? '\u00A0' : ch;
  span.className = 'letter';
  span.style.animationDelay = (0.15 + i * 0.09) + 's';
  welcomeTitleEl.appendChild(span);
});

// sparkles flotando alrededor
const sparkleChars = ['✦', '✧', '💫', '⋆'];
for (let i = 0; i < 18; i++) {
  const s = document.createElement('span');
  s.className = 'sparkle';
  s.textContent = sparkleChars[Math.floor(Math.random() * sparkleChars.length)];
  s.style.left = (Math.random() * 90 + 5) + '%';
  s.style.top = (Math.random() * 70 + 10) + '%';
  s.style.animationDelay = (Math.random() * 4) + 's';
  s.style.fontSize = (0.7 + Math.random() * 0.9) + 'rem';
  sparkleField.appendChild(s);
}

// subtítulo con efecto de máquina de escribir, después del nombre
const nameRevealTime = 150 + partnerName.length * 90 + 400;
setTimeout(() => {
  let i = 0;
  const typeInterval = setInterval(() => {
    welcomeSubtitleEl.textContent = welcomeSubtitleText.slice(0, i + 1);
    i++;
    if (i >= welcomeSubtitleText.length) {
      clearInterval(typeInterval);
      welcomeSubtitleEl.classList.add('done');
      enterBtnEl.classList.add('show');
    }
  }, 45);
}, nameRevealTime);

/* ================= CANVAS / ESTADO ================= */
const canvas = document.getElementById('galaxyCanvas');
const ctx = canvas.getContext('2d');
let W, H, CX, CY;

/* Detecta teléfonos/tablets para reducir la carga gráfica automáticamente */
const isMobile = matchMedia('(pointer: coarse)').matches || window.innerWidth < 820;
const RENDER_SCALE = isMobile ? 0.72 : 1; // renderiza a menor resolución interna y la estira con CSS (más rápido)

function resize() {
  W = canvas.width = Math.round(window.innerWidth * RENDER_SCALE);
  H = canvas.height = Math.round(window.innerHeight * RENDER_SCALE);
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  CX = W / 2;
  CY = H / 2;
}
window.addEventListener('resize', resize);
resize();

const FOV = 520;
const VIEWER_Z = 640;

/* Rotación de la escena */
let angleX = 0.25;   // leve inclinación inicial
let angleY = 0;
let autoSpin = true;
let velY = 0.0016;   // velocidad de auto-rotación

/* Zoom */
let zoom = 1;
const ZOOM_MIN = 0.4;
const ZOOM_MAX = 2.8;

/* Arrastre (mouse / touch vía Pointer Events) — soporta 1 dedo = rotar, 2 dedos = zoom (pellizcar) */
let dragging = false;
let lastPX = 0, lastPY = 0;
let downX = 0, downY = 0;
const activePointers = new Map();
let pinchStartDist = 0;
let pinchStartZoom = 1;

function pointerDist() {
  const pts = Array.from(activePointers.values());
  return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
}

canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  downX = e.clientX;
  downY = e.clientY;

  if (activePointers.size === 1) {
    dragging = true;
    autoSpin = false;
    canvas.classList.add('dragging');
    lastPX = e.clientX;
    lastPY = e.clientY;
  } else if (activePointers.size === 2) {
    dragging = false;
    pinchStartDist = pointerDist();
    pinchStartZoom = zoom;
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (!activePointers.has(e.pointerId)) return;
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (activePointers.size >= 2) {
    const dist = pointerDist();
    if (pinchStartDist > 0) {
      zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, pinchStartZoom * (dist / pinchStartDist)));
    }
    return;
  }

  if (!dragging) return;
  const dx = e.clientX - lastPX;
  const dy = e.clientY - lastPY;
  lastPX = e.clientX;
  lastPY = e.clientY;
  angleY += dx * 0.005;
  angleX += dy * 0.005;
  angleX = Math.max(-1.3, Math.min(1.3, angleX));
});

function endDrag(e) {
  if (e && activePointers.has(e.pointerId)) activePointers.delete(e.pointerId);

  if (activePointers.size === 1) {
    const remaining = Array.from(activePointers.values())[0];
    lastPX = remaining.x;
    lastPY = remaining.y;
    dragging = true;
    autoSpin = false;
    return;
  }

  dragging = false;
  canvas.classList.remove('dragging');
  if (activePointers.size === 0) {
    setTimeout(() => { autoSpin = true; }, 1200);
  }
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('pointerleave', endDrag);

canvas.addEventListener('pointerup', (e) => {
  const moved = Math.hypot(e.clientX - downX, e.clientY - downY);
  if (moved < 6 && activePointers.size === 0) handleClick(e.clientX, e.clientY);
});

/* Zoom con rueda del mouse (desktop) */
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = Math.exp(-e.deltaY * 0.0012);
  zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, zoom * factor));
}, { passive: false });

/* ================= UTILIDADES 3D ================= */
function rand(min, max) { return Math.random() * (max - min) + min; }

function rotatePoint(p) {
  let x = p.x * Math.cos(angleY) - p.z * Math.sin(angleY);
  let z = p.x * Math.sin(angleY) + p.z * Math.cos(angleY);
  let y = p.y;
  let y2 = y * Math.cos(angleX) - z * Math.sin(angleX);
  let z2 = y * Math.sin(angleX) + z * Math.cos(angleX);
  return { x: x, y: y2, z: z2 };
}

function project(p) {
  const zEff = p.z + VIEWER_Z;
  const scale = (FOV / Math.max(zEff, 1)) * zoom;
  return { x: CX + p.x * scale, y: CY + p.y * scale, scale: scale };
}

/* ================= GENERACIÓN DE PUNTOS ================= */

/* Estrellas de fondo (decorativas, esfera grande) — con un toque de polvo rosa/dorado */
const bgStars = [];
const BG_STAR_COUNT = isMobile ? 180 : 500;
for (let i = 0; i < BG_STAR_COUNT; i++) {
  const r = rand(260, 620);
  const theta = rand(0, Math.PI * 2);
  const phi = Math.acos(rand(-1, 1));
  const roll = Math.random();
  const color = roll < 0.12 ? '#ffd6ec' : (roll < 0.2 ? '#ffe9c2' : '#ffffff');
  bgStars.push({
    x: r * Math.sin(phi) * Math.cos(theta),
    y: r * Math.sin(phi) * Math.sin(theta),
    z: r * Math.cos(phi),
    baseR: rand(0.4, 1.6),
    phase: rand(0, Math.PI * 2),
    speed: rand(0.8, 2.2),
    color: color
  });
}

/* Estrellas interactivas (una por frase), esfera media, evitando el agujero negro */
const interactiveStars = [];
{
  const n = phrases.length;
  for (let i = 0; i < n; i++) {
    const y = 1 - (i / (n - 1)) * 2;
    const radiusAtY = Math.sqrt(1 - y * y);
    const goldenAngle = Math.PI * (3 - Math.sqrt(5));
    const theta = goldenAngle * i;
    const R = rand(150, 300);
    const x = Math.cos(theta) * radiusAtY * R;
    const z = Math.sin(theta) * radiusAtY * R;
    interactiveStars.push({
      x: x, y: y * R * 0.6, z: z,
      baseR: rand(2.6, 4.2),
      phase: rand(0, Math.PI * 2),
      speed: rand(1, 1.8),
      phrase: phrases[i],
      screenX: 0, screenY: 0, screenR: 0
    });
  }
}

/* Disco de acreción del agujero negro: puntos en un anillo plano, inclinado */
const diskParticles = [];
{
  const ringCount = 5;
  for (let ring = 0; ring < ringCount; ring++) {
    const rBase = 55 + ring * 16;
    const count = isMobile ? (28 + ring * 4) : (70 + ring * 10);
    for (let i = 0; i < count; i++) {
      const theta = rand(0, Math.PI * 2);
      const r = rBase + rand(-4, 4);
      diskParticles.push({
        theta: theta,
        r: r,
        y0: rand(-2, 2),
        speed: rand(0.15, 0.35) * (ring % 2 === 0 ? 1 : -1) * 0.4,
        size: rand(0.8, 2.2),
        colorT: ring / (ringCount - 1)
      });
    }
  }
}

/* Paleta romántica del disco: blanco -> dorado -> rosa -> magenta -> púrpura profundo */
function ringColor(t) {
  const stops = [
    [255, 255, 255],
    [255, 214, 150],
    [255, 150, 190],
    [255, 100, 160],
    [190, 70, 140]
  ];
  const idx = Math.min(stops.length - 2, Math.floor(t * (stops.length - 1)));
  const localT = t * (stops.length - 1) - idx;
  const c1 = stops[idx], c2 = stops[idx + 1];
  const r = c1[0] + (c2[0] - c1[0]) * localT;
  const g = c1[1] + (c2[1] - c1[1]) * localT;
  const b = c1[2] + (c2[2] - c1[2]) * localT;
  return `${r|0},${g|0},${b|0}`;
}

/* ================= RENDER LOOP ================= */
let t0 = performance.now();

function drawBlackHole() {
  const center = project({ x: 0, y: 0, z: 0 });
  const baseScale = center.scale;

  const haloR = 70 * baseScale;
  const grad = ctx.createRadialGradient(center.x, center.y, 10, center.x, center.y, haloR);
  grad.addColorStop(0, 'rgba(255,200,220,0.35)');
  grad.addColorStop(0.4, 'rgba(255,120,170,0.14)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(center.x, center.y, haloR, 0, Math.PI * 2);
  ctx.fill();

  const eventR = 34 * baseScale;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(center.x, center.y, eventR, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,225,235,0.85)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.arc(center.x, center.y, eventR + 1.5, 0, Math.PI * 2);
  ctx.stroke();
}

function frame(now) {
  const dt = Math.min(50, now - t0);
  t0 = now;

  // en vez de borrar todo, pintamos una capa semitransparente:
  // así lo que se mueve (rotación / zoom) deja una breve estela que se desvanece
  ctx.fillStyle = 'rgba(11, 4, 16, 0.28)';
  ctx.fillRect(0, 0, W, H);

  if (autoSpin) {
    angleY += velY * (dt / 16.6);
  }

  const time = now / 1000;
  const drawList = [];

  for (const s of bgStars) {
    const rp = rotatePoint(s);
    const pr = project(rp);
    if (pr.x < -50 || pr.x > W + 50 || pr.y < -50 || pr.y > H + 50) continue;
    const twinkle = 0.35 + 0.35 * Math.sin(time * s.speed + s.phase);
    drawList.push({ z: rp.z, type: 'bg', x: pr.x, y: pr.y, r: Math.max(0.3, s.baseR * pr.scale * 0.35), alpha: twinkle, color: s.color });
  }

  for (const d of diskParticles) {
    const theta = d.theta + time * d.speed;
    const localX = Math.cos(theta) * d.r;
    const localZraw = Math.sin(theta) * d.r;
    const tilt = 1.1;
    const ly = localZraw * Math.sin(tilt) * 0.15 + d.y0 * Math.cos(tilt);
    const lz = localZraw * Math.cos(tilt);
    const rp = rotatePoint({ x: localX, y: ly, z: lz });
    const pr = project(rp);
    drawList.push({ z: rp.z, type: 'ring', x: pr.x, y: pr.y, r: Math.max(0.5, d.size * pr.scale * 0.55), color: ringColor(d.colorT) });
  }

  for (const s of interactiveStars) {
    const rp = rotatePoint(s);
    const pr = project(rp);
    const twinkle = 0.75 + 0.25 * Math.sin(time * s.speed + s.phase);
    const screenR = Math.max(1.4, s.baseR * pr.scale * 0.45);
    s.screenX = pr.x;
    s.screenY = pr.y;
    s.screenR = screenR + (isMobile ? 12 : 6);
    drawList.push({ z: rp.z, type: 'star', x: pr.x, y: pr.y, r: screenR, alpha: twinkle });
  }

  drawList.sort((a, b) => b.z - a.z);

  for (const item of drawList) {
    if (item.type === 'bg') {
      ctx.globalAlpha = item.alpha;
      ctx.fillStyle = item.color;
      ctx.beginPath();
      ctx.arc(item.x, item.y, item.r, 0, Math.PI * 2);
      ctx.fill();
    } else if (item.type === 'ring') {
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = `rgb(${item.color})`;
      if (!isMobile) {
        ctx.shadowColor = `rgb(${item.color})`;
        ctx.shadowBlur = 6;
      }
      ctx.beginPath();
      ctx.arc(item.x, item.y, item.r, 0, Math.PI * 2);
      ctx.fill();
      if (!isMobile) ctx.shadowBlur = 0;
    } else if (item.type === 'star') {
      ctx.globalAlpha = item.alpha;
      ctx.fillStyle = '#fff3e0';
      if (isMobile) {
        // en móvil dibujamos un halo simple con un segundo círculo en vez de shadowBlur (mucho más barato)
        ctx.globalAlpha = item.alpha * 0.35;
        ctx.beginPath();
        ctx.arc(item.x, item.y, item.r * 2.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = item.alpha;
        ctx.beginPath();
        ctx.arc(item.x, item.y, item.r, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.shadowColor = 'rgba(255,182,213,0.9)';
        ctx.shadowBlur = item.r * 3;
        ctx.beginPath();
        ctx.arc(item.x, item.y, item.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }
  }
  ctx.globalAlpha = 1;

  drawBlackHole();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ================= CLICK EN ESTRELLAS ================= */
function handleClick(clientX, clientY) {
  // convertimos coordenadas de pantalla (CSS px) a coordenadas internas del canvas,
  // ya que en móvil el canvas se renderiza a menor resolución y luego se estira
  const x = clientX * RENDER_SCALE;
  const y = clientY * RENDER_SCALE;
  let closest = null;
  let closestDist = Infinity;
  for (const s of interactiveStars) {
    const d = Math.hypot(x - s.screenX, y - s.screenY);
    if (d < s.screenR && d < closestDist) {
      closestDist = d;
      closest = s;
    }
  }
  if (closest) showPhrase(closest.phrase);
}

/* ================= CONTADOR DE TIEMPO JUNTOS ================= */
const loveCounterEl = document.getElementById('loveCounter');
function pad(n) { return String(n).padStart(2, '0'); }

function updateLoveCounter() {
  const now = new Date();
  let years = now.getFullYear() - START_DATE.getFullYear();
  let months = now.getMonth() - START_DATE.getMonth();
  let days = now.getDate() - START_DATE.getDate();
  let hours = now.getHours() - START_DATE.getHours();
  let minutes = now.getMinutes() - START_DATE.getMinutes();
  let seconds = now.getSeconds() - START_DATE.getSeconds();

  if (seconds < 0) { seconds += 60; minutes--; }
  if (minutes < 0) { minutes += 60; hours--; }
  if (hours < 0) { hours += 24; days--; }
  if (days < 0) {
    const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
    days += prevMonth.getDate();
    months--;
  }
  if (months < 0) { months += 12; years--; }

  loveCounterEl.innerHTML =
    `💞 Juntos hace <b>${years}</b> años, <b>${months}</b> meses y <b>${days}</b> días<br>` +
    `<b>${pad(hours)}:${pad(minutes)}:${pad(seconds)}</b>`;
}

/* ================= AUDIO ================= */
let audioCtx = null;
let masterGain = null;
let muted = false;
const muteBtn = document.getElementById('muteBtn');
const bgMusic = document.getElementById('bgMusic');

/* Tus dos pistas — se alternan en loop con transición de volumen */
const playlist = ['track1.mp3', 'track2.mp3'];
let trackIndex = 0;
const MAX_VOL = 0.55;
const FADE_OUT_TIME = 3;   // segundos antes del final en que empieza a bajar
const FADE_IN_TIME = 3.5; // segundos que tarda en subir la siguiente pista
let fadingOut = false;
let fadeTimer = null;

function fadeVolume(target, duration, onDone) {
  clearInterval(fadeTimer);
  const steps = 30;
  const stepTime = (duration * 1000) / steps;
  const startVol = bgMusic.volume;
  const diff = target - startVol;
  let i = 0;
  fadeTimer = setInterval(() => {
    i++;
    bgMusic.volume = Math.max(0, Math.min(1, startVol + diff * (i / steps)));
    if (i >= steps) {
      clearInterval(fadeTimer);
      if (onDone) onDone();
    }
  }, stepTime);
}

function playTrack(index, withFadeIn) {
  bgMusic.src = playlist[index];
  bgMusic.currentTime = 0;
  bgMusic.volume = 0;
  bgMusic.play().catch(() => {});
  fadingOut = false;
  if (withFadeIn) fadeVolume(MAX_VOL, FADE_IN_TIME);
  else bgMusic.volume = MAX_VOL;
}

bgMusic.addEventListener('timeupdate', () => {
  if (!fadingOut && bgMusic.duration && (bgMusic.duration - bgMusic.currentTime) <= FADE_OUT_TIME) {
    fadingOut = true;
    fadeVolume(0, FADE_OUT_TIME);
  }
});

bgMusic.addEventListener('ended', () => {
  trackIndex = (trackIndex + 1) % playlist.length;
  playTrack(trackIndex, true);
});

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // ganancia solo para el chime de las estrellas (independiente del <audio>)
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.6;
  masterGain.connect(audioCtx.destination);

  playTrack(trackIndex, true);
  muteBtn.style.display = 'flex';
}

function toggleMute() {
  if (!audioCtx) return;
  muted = !muted;
  bgMusic.muted = muted;
  masterGain.gain.linearRampToValueAtTime(muted ? 0 : 0.6, audioCtx.currentTime + 0.4);
  muteBtn.textContent = muted ? '🔇' : '🔊';
}
muteBtn.addEventListener('click', toggleMute);

/* Pequeño "chime" al tocar una estrella */
function playChime() {
  if (!audioCtx || muted) return;
  const now = audioCtx.currentTime;
  const notes = [523.25, 659.25, 783.99, 987.77]; // Do, Mi, Sol, Si (agradables entre sí)
  const freq = notes[Math.floor(Math.random() * notes.length)];

  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = freq;

  const g = audioCtx.createGain();
  g.gain.value = 0;
  osc.connect(g);
  g.connect(masterGain);

  osc.start(now);
  g.gain.linearRampToValueAtTime(0.22, now + 0.04);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 1.3);
  osc.stop(now + 1.4);
}

/* ================= UI: BIENVENIDA Y TARJETA ================= */
const welcome = document.getElementById('welcome');
const overlay = document.getElementById('overlay');
const phraseCard = document.getElementById('phraseCard');
const phraseText = document.getElementById('phraseText');
const closeCard = document.getElementById('closeCard');
const hint = document.getElementById('hint');

function showPhrase(text) {
  phraseText.textContent = text;
  phraseCard.classList.add('show');
  overlay.classList.add('show');
  playChime();
}
function hidePhrase() {
  phraseCard.classList.remove('show');
  overlay.classList.remove('show');
}
closeCard.addEventListener('click', hidePhrase);
overlay.addEventListener('click', hidePhrase);

enterBtnEl.addEventListener('click', () => {
  initAudio(); // el audio solo puede iniciar tras un gesto del usuario (click)
  welcome.classList.add('hidden');
  setTimeout(() => {
    hint.style.display = 'block';
    loveCounterEl.classList.add('show');
    updateLoveCounter();
    setInterval(updateLoveCounter, 1000);
  }, 1000);
});
</script>
